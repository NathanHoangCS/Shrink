<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Shrink</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"></polyline>
          <polyline points="20 10 14 10 14 4"></polyline>
          <line x1="14" y1="10" x2="21" y2="3"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <span>Shrink</span>
      </div>
      <button class="history-btn" id="historyBtn" title="Recent compressions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>
    </header>

    <div class="drop-zone" id="dropZone">
      <div class="drop-inner">
        <div class="drop-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <p class="drop-title">Drop images here</p>
        <p class="drop-sub">JPEG · PNG · WebP · GIF</p>
        <button class="browse-btn" id="browseBtn">Browse files</button>
        <input type="file" id="fileInput"
               accept="image/jpeg,image/png,image/webp,image/gif"
               multiple hidden />
      </div>
    </div>

    <div class="thumb-strip hidden" id="thumbStrip">
      <div class="thumb-list" id="thumbList"></div>
      <button class="add-more-btn" id="addMoreBtn">+</button>
    </div>

    <div class="controls hidden" id="controls">
      <div class="control-row">
        <label class="control-label">Output format</label>
        <div class="format-pills" id="formatPills">
          <button class="pill active" data-format="jpeg">JPEG</button>
          <button class="pill" data-format="png">PNG</button>
          <button class="pill" data-format="webp">WebP</button>
        </div>
      </div>
      <div class="control-row" id="qualityRow">
        <label class="control-label">
          Quality <span class="quality-val" id="qualityVal">82%</span>
        </label>
        <input type="range" id="qualitySlider"
               min="10" max="100" value="82" class="slider" />
      </div>
      <div class="control-row">
        <label class="control-label">Max width <span class="optional">optional</span></label>
        <div class="resize-input-wrap">
          <input type="number" id="maxWidth"
                 placeholder="e.g. 1920" class="num-input" />
          <span class="unit">px</span>
        </div>
      </div>
      <div class="control-row toggle-row">
        <label class="control-label" for="exifToggle">Strip EXIF metadata</label>
        <label class="toggle">
          <input type="checkbox" id="exifToggle" checked />
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="results hidden" id="results">
      <div class="result-stats" id="resultStats"></div>
      <div class="progress-bar hidden" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="actions hidden" id="actions">
      <button class="btn-secondary" id="resetBtn">Clear</button>
      <button class="btn-primary" id="downloadBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download
      </button>
    </div>

    <div class="history-panel hidden" id="historyPanel">
      <div class="history-header">
        <span>Recent</span>
        <button class="clear-history-btn" id="clearHistoryBtn">Clear all</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

  </div>
  <script src="lib/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
